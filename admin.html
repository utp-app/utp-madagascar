<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTP - Administration</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:#f4f7f6; padding:20px; display:flex; justify-content:center; }
  .container { max-width:900px; width:100%; }
  .header { background:linear-gradient(135deg,#1A237E,#3949ab); color:white; padding:20px; border-radius:12px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
  .header h1 { font-size:20px; }
  .btn { padding:10px 18px; border:none; border-radius:8px; cursor:pointer; font-weight:700; font-size:13px; }
  .btn-danger { background:#C62828; color:white; }
  .btn-primary { background:#00897B; color:white; }
  
  .nav-tabs { display:flex; gap:10px; margin-bottom:20px; }
  .nav-tab { padding:12px 20px; background:white; border:none; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; color:#666; }
  .nav-tab.active { background:#1A237E; color:white; }
  
  .card { background:white; border-radius:12px; padding:20px; margin-bottom:20px; box-shadow:0 4px 15px rgba(0,0,0,0.05); }
  .card h3 { color:#1A237E; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px; }
  
  .form-row { display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .form-group { flex:1; min-width:200px; }
  .form-group label { display:block; font-size:11px; font-weight:700; margin-bottom:4px; color:#333; }
  .form-group input, .form-group select { width:100%; padding:10px; border:2px solid #e0e0e0; border-radius:8px; font-size:12px; }
  
  table { width:100%; border-collapse:collapse; font-size:12px; margin-top:10px; }
  th, td { padding:10px; text-align:left; border-bottom:1px solid #eee; }
  th { background:#1A237E; color:white; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⭐ Administration UTP</h1>
    <button class="btn btn-danger" onclick="window.location.href='/'">Retour</button>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" id="navCentres" onclick="changerOnglet('centres')">🏢 Centres</button>
    <button class="nav-tab" id="navUsers" onclick="changerOnglet('users')">👥 Utilisateurs</button>
  </div>

  <!-- Onglet Centres -->
  <div id="ongletCentres">
    <div class="card">
      <h3>➕ Créer un nouveau centre</h3>
      <div class="form-row">
        <div class="form-group"><label>Nom du centre</label><input type="text" id="newCentreNom"></div>
      </div>
      <button class="btn btn-primary" onclick="creerCentre()">Créer le centre</button>
    </div>
    <div class="card">
      <h3>📋 Liste des centres</h3>
      <table><thead><tr><th>ID</th><th>Nom</th></tr></thead><tbody id="tbodyCentres"></tbody></table>
    </div>
  </div>

  <!-- Onglet Utilisateurs -->
  <div id="ongletUsers" class="hidden">
    <div class="card">
      <h3>➕ Créer un utilisateur</h3>
      <div class="form-row">
        <div class="form-group"><label>Nom</label><input type="text" id="newUserName"></div>
        <div class="form-group"><label>Code d'accès</label><input type="text" id="newUserCode"></div>
        <div class="form-group"><label>Centre (Optionnel)</label><select id="newUserCentre"><option value="">Aucun</option></select></div>
      </div>
      <button class="btn btn-primary" onclick="creerUtilisateur()">Créer l'utilisateur</button>
    </div>
    <div class="card">
      <h3>📋 Liste des utilisateurs</h3>
      <table><thead><tr><th>ID</th><th>Nom</th><th>Code</th><th>Centre</th></tr></thead><tbody id="tbodyUsers"></tbody></table>
    </div>
  </div>
</div>

<script>
const API_BASE = '';
function apiHeaders() {
  return { 'Content-Type': 'application/json', 'x-code-acces': 'ADMIN2030' }; // Code admin
}

async function apiFetch(path, method = 'GET', body = null) {
  const opts = { method, headers: apiHeaders() };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API_BASE + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Erreur API');
  return r.json();
}

window.onload = async function() {
  await chargerCentres();
  await chargerUtilisateurs();
};

function changerOnglet(onglet) {
  ['centres','users'].forEach(o => {
    document.getElementById('nav' + o.charAt(0).toUpperCase() + o.slice(1)).classList.remove('active');
    document.getElementById('onglet' + o.charAt(0).toUpperCase() + o.slice(1)).classList.add('hidden');
  });
  document.getElementById('nav' + onglet.charAt(0).toUpperCase() + onglet.slice(1)).classList.add('active');
  document.getElementById('onglet' + onglet.charAt(0).toUpperCase() + onglet.slice(1)).classList.remove('hidden');
}

async function chargerCentres() {
  const centres = await apiFetch('/api/centres');
  document.getElementById('tbodyCentres').innerHTML = centres.map(c => 
    `<tr><td>${c.id}</td><td>${c.nom}</td></tr>`
  ).join('');
  
  const select = document.getElementById('newUserCentre');
  select.innerHTML = '<option value="">Aucun</option>' + centres.map(c => 
    `<option value="${c.id}">${c.nom}</option>`
  ).join('');
}

async function chargerUtilisateurs() {
  const users = await apiFetch('/api/responsables');
  document.getElementById('tbodyUsers').innerHTML = users.map(u => 
    `<tr><td>${u.id}</td><td>${u.nom}</td><td>${u.code_acces}</td><td>${u.centre_nom || '-'}</td></tr>`
  ).join('');
}

async function creerCentre() {
  const nom = document.getElementById('newCentreNom').value;
  if (!nom) return alert('Nom requis');
  await apiFetch('/api/admin/centres', 'POST', { nom });
  alert('✅ Centre créé !');
  document.getElementById('newCentreNom').value = '';
  await chargerCentres();
}

async function creerUtilisateur() {
  const nom = document.getElementById('newUserName').value;
  const code = document.getElementById('newUserCode').value;
  const centre_id = document.getElementById('newUserCentre').value || null;
  if (!nom || !code) return alert('Nom et Code requis');
  await apiFetch('/api/admin/utilisateurs', 'POST', { nom, code_acces: code, centre_id });
  alert('✅ Utilisateur créé !');
  document.getElementById('newUserName').value = '';
  document.getElementById('newUserCode').value = '';
  await chargerUtilisateurs();
}
</script>
</body>
</html>
