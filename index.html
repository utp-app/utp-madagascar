<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTP – Gestion des centres</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo UTP" style="height: 40px; width: 40px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 1px solid #ccc;">
    <h1>UTP – Système de gestion</h1>
    <div id="user-info"></div>
  </header>

  <section id="login-screen" class="screen active">
    <div style="text-align:center; margin-bottom: 20px;">
      <img src="logo.png" alt="Logo UTP" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
    </div>
    <h2 style="text-align:center; margin-bottom: 20px;">Connexion</h2>
    <div style="display:flex; flex-direction:column; gap:10px; max-width:300px; margin:0 auto;">
      <input id="code-input" placeholder="Entrez votre code d'accès" style="width:100%; padding:12px; border:2px solid #ccc; border-radius:8px; font-size:16px;" />
      <button onclick="login()" style="width:100%; padding:12px; font-size:16px; border-radius:8px; background:#1e3a5f; color:white; font-weight:bold; cursor:pointer;">Se connecter</button>
    </div>
    <p id="login-error" class="error" style="text-align:center; margin-top:10px; color:#e74c3c; font-weight:bold;"></p>
  </section>

  <section id="main-screen" class="screen">
    <nav>
      <button onclick="showTab('etudiants')">Étudiants</button>
      <button onclick="showTab('paiements')">Paiements</button>
      <button onclick="window.location.href='/badge.html'" style="background:#2E7D32; color:white;">🎫 Badges</button>
      <button id="btn-admin" onclick="window.location.href='/admin.html'" style="display:none; background:#00897B; color:white;">⚙️ Admin</button>
      <button id="btn-direction" onclick="window.location.href='/direction.html'" style="display:none; background:#E65100; color:white;">⭐ Direction</button>
      <button onclick="logout()" style="margin-left:auto;background:#e74c3c;color:#fff">Déconnexion</button>
    </nav>

    <div id="tab-etudiants" class="tab active">
      <h2>Inscrire un étudiant</h2>
      <div class="card" id="form-etudiant">
        <input id="e-nom" placeholder="Nom" />
        <input id="e-prenom" placeholder="Prénom" />
        <input id="e-tel" placeholder="Contact (Téléphone)" />
        
        <select id="e-matiere"></select>
        <select id="e-niveau"></select>
        <select id="e-centre"></select>
        <input id="e-date" type="date" />
        <button onclick="ajouterEtudiant()">Ajouter l'élève</button>
      </div>
      <h3>Liste des élèves</h3>
      <table id="table-etudiants">
        <thead><tr><th>ID</th><th>Nom</th><th>Matière</th><th>Niveau</th><th>Centre</th><th>Payé</th><th>Badge</th><th>Date</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="tab-paiements" class="tab">
      <h2>Paiements / Tickets</h2>
      <div class="card">
        <select id="p-etudiant" style="width:100%; margin-bottom:10px;"></select>
        <input id="p-montant" type="number" placeholder="Montant (Ar)" style="width:100%; margin-bottom:10px;" />
        <select id="p-tranche" style="width:100%; margin-bottom:10px;">
          <option value="total">Total</option>
          <option value="tranche1">Tranche 1</option>
          <option value="tranche2">Tranche 2</option>
        </select>
        <select id="p-mode" style="width:100%; margin-bottom:10px;" onchange="toggleReference()">
          <option value="Espèce">Espèce</option>
          <option value="Mobile Money">Mobile Money (Mvola, Airtel, Orange)</option>
          <option value="Virement">Versement bancaire</option>
          <option value="Chèque">Chèque</option>
        </select>
        <input id="p-reference" type="text" placeholder="Référence (N° transaction)" style="width:100%; margin-bottom:10px; display:none;" />
        <button onclick="ajouterPaiement()">Enregistrer</button>
      </div>
      <div id="ticket-result"></div>
    </div>
  </section>
  <script src="app.js"></script>
</body>
</html>
