<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTP – Gestion</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.png" style="height: 40px; border-radius: 50%; margin-right: 10px;">
    <h1>UTP – Système de gestion</h1>
    <div id="user-info"></div>
  </header>

  <section id="login-screen" class="screen active" style="text-align:center; margin-top:50px;">
    <img src="logo.png" style="width: 100px; height: 100px; border-radius: 50%; margin-bottom:20px;">
    <h2>Connexion</h2>
    <input id="code-input" placeholder="Code d'accès" style="padding:10px; margin:10px; width:200px;" />
    <button onclick="login()" style="padding:10px 20px; background:#1A237E; color:white; border:none; border-radius:5px;">Se connecter</button>
    <p id="login-error" style="color:red; margin-top:10px;"></p>
  </section>

  <section id="main-screen" class="screen">
        <nav>
      <!-- Ces boutons sont visibles uniquement par les Responsables -->
      <div id="nav-responsable" style="display:none; gap:10px;">
        <button onclick="showTab('etudiants')">Étudiants</button>
        <button onclick="showTab('paiements')">Paiements</button>
        <button onclick="window.location.href='/badge.html'" style="background:#2E7D32; color:white;">🎫 Badges</button>
      </div>

      <!-- Ces boutons sont visibles uniquement par l'Admin et la Direction -->
      <button id="btn-admin" onclick="window.location.href='/admin.html'" style="display:none; background:#00897B; color:white;">⚙️ Paramétrage Admin</button>
      <button id="btn-direction" onclick="window.location.href='/direction.html'" style="display:none; background:#E65100; color:white;">⭐ Tableau de Bord Direction</button>
      
      <button onclick="logout()" style="margin-left:auto;background:#e74c3c;color:#fff">Déconnexion</button>
    </nav>

    <!-- Inscription -->
    <div id="tab-etudiants" class="tab active">
      <h2>Inscrire un étudiant</h2>
      <div class="card">
        <input id="e-nom" placeholder="Nom" style="width:100%; margin-bottom:10px;" />
        <input id="e-prenom" placeholder="Prénom" style="width:100%; margin-bottom:10px;" />
        <input id="e-tel" placeholder="Contact" style="width:100%; margin-bottom:10px;" />
        <select id="e-matiere" style="width:100%; margin-bottom:10px;"></select>
        <select id="e-niveau" style="width:100%; margin-bottom:10px;"></select>
        <select id="e-centre" style="width:100%; margin-bottom:10px;"></select>
        <input id="e-date" type="date" style="width:100%; margin-bottom:10px;" />
        <button onclick="ajouterEtudiant()" style="width:100%; padding:10px; background:green; color:white;">Ajouter</button>
      </div>
      
      <h3>Liste</h3>
      <table id="table-etudiants" style="width:100%; text-align:left;">
        <thead><tr><th>ID</th><th>Nom</th><th>Matière</th><th>Niveau</th><th>Centre</th><th>Payé</th><th>Badge</th><th>Examen</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Paiement -->
    <div id="tab-paiements" class="tab">
      <h2>Paiements</h2>
      <div class="card">
        <select id="p-etudiant" style="width:100%; margin-bottom:10px;"></select>
        <input id="p-montant" type="number" placeholder="Montant" style="width:100%; margin-bottom:10px;" />
        <select id="p-tranche" style="width:100%; margin-bottom:10px;">
          <option value="total">Total</option>
          <option value="tranche1">Tranche 1</option>
          <option value="tranche2">Tranche 2</option>
        </select>
        <select id="p-mode" style="width:100%; margin-bottom:10px;" onchange="toggleReference()">
          <option value="Espèce">Espèce</option>
          <option value="Mobile Money">Mobile Money</option>
          <option value="Virement">Virement</option>
          <option value="Chèque">Chèque</option>
        </select>
        <input id="p-reference" type="text" placeholder="Référence" style="width:100%; margin-bottom:10px; display:none;" />
        <button onclick="ajouterPaiement()" style="width:100%; padding:10px; background:blue; color:white;">Enregistrer</button>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
