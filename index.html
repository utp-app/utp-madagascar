<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UTP Madagascar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="logo.png" alt="Logo UTP" style="height: 40px; width: 40px; border-radius: 50%; object-fit: cover; margin-right: 15px; border: 1px solid #ccc;">
    <h1>UTP MADAGASCAR</h1>
    <div id="user-info"></div>
  </header>

  <!-- ÉCRAN DE CONNEXION -->
  <section id="login-screen" class="screen active">
    <div style="text-align:center; margin-bottom: 20px;">
      <img src="logo.png" alt="Logo UTP" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.2);">
    </div>
    <h2>Connexion</h2>
    
    <input type="password" id="code-input" onkeypress="if(event.key === 'Enter') login()" autocomplete="new-password" placeholder="Entrez votre code d'accès" />
    <button onclick="login()">Se connecter</button>
    
    <p id="login-error" class="error"></p>
  </section>

  <!-- ÉCRAN PRINCIPAL -->
  <section id="main-screen" class="screen">
    
    <!-- ==============================================
         INTERFACE RÉSERVÉE AUX RESPONSABLES DE CENTRE 
         ============================================== -->
    <div id="interface-responsable" style="display:none;">
      
      <!-- LE MENU EST BIEN ICI (EN HAUT) -->
      <nav>
        <button onclick="showTab('etudiants')">Étudiants</button>
        <button onclick="showTab('paiements')">Paiements</button>
        <button onclick="showTab('notes')">Notes</button>
        <button onclick="showTab('livres')">📚 Livres</button>
        <button onclick="window.location.href='/badge.html'" style="background:#2E7D32; color:white;">🎫 Badges</button>
        <button onclick="logout()" style="margin-left:auto;background:#e74c3c;color:#fff">Déconnexion</button>
      </nav>

      <!-- Onglet Étudiants (Inscription) -->
      <div id="tab-etudiants" class="tab active">
        <h2 style="text-align: center; color: #1e3a5f;">Inscrire un étudiant</h2>
        <div class="card" id="form-etudiant">
          <input id="e-nom" placeholder="Nom" required />
          <input id="e-prenom" placeholder="Prénom" required />
          <input id="e-tel" placeholder="Contact (Téléphone)" required />
          <select id="e-matiere" required></select>
          <select id="e-niveau" required></select>
          <select id="e-centre" required></select>
          <input id="e-date" type="date" required />
          <button class="btn-submit" onclick="ajouterEtudiant()">Ajouter l'élève</button>
        </div>
        
        <h3 style="text-align: center; color: #1e3a5f; margin-top: 30px;">Liste de mes élèves</h3>
        <table id="table-etudiants">
          <thead><tr><th>ID</th><th>Nom</th><th>Matière</th><th>Niveau</th><th>Centre</th><th>Payé</th><th>Badge</th><th>Date</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>

      <!-- Onglet Paiements -->
      <div id="tab-paiements" class="tab">
        <h2 style="text-align: center; color: #1e3a5f;">Enregistrer un paiement</h2>
        <div class="card">
          <select id="p-etudiant" style="margin-bottom:15px;"></select>
          
          <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">Montant total de la formation (Ar)</label>
          <input id="p-total" type="number" value="50000" placeholder="Montant total" style="margin-bottom:15px;" oninput="calculerReste()" />
          
          <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">Montant versé maintenant (Ar)</label>
          <input id="p-montant" type="number" placeholder="Montant versé" style="margin-bottom:15px;" oninput="calculerReste()" />
          
          <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">Reste à payer (Ar)</label>
          <input id="p-reste" type="text" readonly placeholder="Reste à payer" style="background:#eee; font-weight:bold; color:#C62828; margin-bottom:15px;" />

          <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">Type de paiement</label>
          <select id="p-tranche" style="margin-bottom:15px;">
            <option value="total">Total</option>
            <option value="tranche1">Tranche 1</option>
            <option value="tranche2">Tranche 2</option>
          </select>

          <label style="display:block; font-size:12px; font-weight:bold; margin-bottom:5px;">Mode de paiement</label>
          <select id="p-mode" style="margin-bottom:15px;" onchange="toggleReference()">
            <option value="Espèce">Espèce</option>
            <option value="Mobile Money">Mobile Money</option>
            <option value="Virement">Virement</option>
            <option value="Chèque">Chèque</option>
          </select>
          
          <input id="p-reference" type="text" placeholder="Référence (N° transaction)" style="display:none; margin-bottom:15px;" />
          
          <button class="btn-submit" onclick="ajouterPaiement()">Enregistrer et générer le ticket</button>
        </div>
        <div id="ticket-result"></div>
      </div>

      <!-- Onglet Notes -->
      <div id="tab-notes" class="tab">
        <h2 style="text-align: center; color: #1e3a5f;">Fiche de Note</h2>
        <div class="card">
          <select id="n-etudiant" onchange="chargerBareme()" style="margin-bottom:15px;"></select>
          <select id="n-type" style="margin-bottom:15px;">
            <option value="normal">Examen normal</option>
            <option value="reprise">Repêchage</option>
          </select>
          <div id="n-bareme" style="margin-bottom:15px;"></div>
          <button class="btn-submit" onclick="enregistrerNote()">Enregistrer la note</button>
        </div>
        <div id="note-result"></div>
      </div>

      <!-- Onglet Livres -->
      <div id="tab-livres" class="tab">
        <h2 style="text-align: center; color: #1e3a5f;">Commander des livres</h2>
        <div class="card">
          <p style="font-size:13px; color:#666; margin-bottom:15px; text-align:center;">Chaque livre coûte 20 000 Ar. Le montant sera automatiquement déduit de votre caisse et versé à la Direction.</p>
          <input id="l-nombre" type="number" placeholder="Nombre de livres à commander" style="margin-bottom:15px;" />
          <input id="l-total" type="text" readonly placeholder="Montant total (Ar)" style="background:#eee; margin-bottom:15px;" />
          <button class="btn-submit" onclick="commanderLivres()">Envoyer la commande à la Direction</button>
        </div>
      </div>
    </div>

    <!-- ==============================================
         INTERFACE RÉSERVÉE À L'ADMIN ET LA DIRECTION 
         ============================================== -->
    <div id="interface-admin-direction" style="display:none; text-align:center; margin-top: 50px;">
      <button id="btn-admin" onclick="window.location.href='/admin.html'" style="display:none; padding: 20px; font-size: 18px; background:#00897B; color:white; border-radius:10px; cursor:pointer; margin:10px; width:auto; border:none;">⚙️ Paramétrage Admin</button>
      <button id="btn-direction" onclick="window.location.href='/direction.html'" style="display:none; padding: 20px; font-size: 18px; background:#E65100; color:white; border-radius:10px; cursor:pointer; margin:10px; width:auto; border:none;">⭐ Tableau de Bord Direction</button>
      <br><br>
      <button onclick="logout()" style="padding: 10px 20px; background:#e74c3c; color:white; border-radius:5px; cursor:pointer; width:auto; border:none;">Déconnexion</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
