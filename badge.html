<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTP - Générateur de Badge</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,sans-serif; }
body { background: #1A237E; min-height:100vh; display:flex; justify-content:center; align-items:flex-start; padding:20px; }
.container { background:white; border-radius:20px; padding:30px; max-width:500px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,0.4); margin-top:20px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; padding-bottom:15px; border-bottom:2px solid #1A237E; }
.header h1 { font-size:18px; color:#1A237E; }
.form-group { margin-bottom:15px; }
.form-group label { display:block; font-size:12px; font-weight:700; color:#333; margin-bottom:5px; }
.form-group input { width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:10px; font-size:13px; }
.form-group input[readonly] { background:#F1F8E9; color:#1A237E; font-weight:700; cursor:not-allowed; }
.form-row { display:flex; gap:10px; }
.form-row .form-group { flex:1; }
.btn { width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; margin-top:10px; }
.btn-primary { background:#6A1B9A; color:white; }
.btn-secondary { background:#f0f0f0; color:#555; }
.btn-photo { background:#FF9800; color:white; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; text-align:center; border:none; margin-bottom:10px; }
.btn-camera { background:#0D47A1; color:white; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; text-align:center; border:none; margin-bottom:10px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.preview-container { margin-top:30px; display:none; text-align:center; border-top:2px dashed #ccc; padding-top:20px; }
.alerte { padding:10px; border-radius:8px; font-size:12px; margin-bottom:10px; }
.alerte-ok { background:#E8F5E9; color:#2E7D32; border:1px solid #A5D6A7; }
.alerte-ko { background:#FFEBEE; color:#C62828; border:1px solid #EF9A9A; }

/* =========================================
   BADGE CLASSIQUE (Format Portrait)
   ========================================= */
#badgeClassique { 
  width: 300px; height: 420px; 
  background-image: url('fond_badge_classique.jpg');
  background-size: 100% 100%;
  border-radius:12px; position:relative; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  margin:0 auto; overflow:hidden; 
}
.bc-centre-name { position:absolute; top: 14.5%; left: 50%; transform:translateX(-50%); width:90%; text-align:center; font-size:12px; font-weight:900; color:#fff; text-transform:uppercase; }
.bc-photo-box { position:absolute; top: 23%; left: 50%; transform:translateX(-50%); width: 100px; height: 100px; border-radius: 50%; overflow: hidden; border: 3px solid #ccc; background: #fff; display: flex; justify-content: center; align-items: center; }
.bc-photo-box img { width:100%; height:100%; object-fit:cover; display:none; }
.bc-photo-fallback { width:100%; height:100%; background: url('logo.png') center/cover; display:block; }

.bc-nom-box { position:absolute; top: 51%; left: 50%; transform:translateX(-50%); width: 80%; text-align:center; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; padding: 5px 0; }
.bc-nom-box .text { font-size:18px; font-weight:900; color:#fff; text-transform:uppercase; }

.bc-prenom-box { position:absolute; top: 59%; left: 50%; transform:translateX(-50%); width: 80%; text-align:center; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.3); border-radius: 5px; padding: 5px 0; }
.bc-prenom-box .text { font-size:16px; font-weight:900; color:#fff; text-transform:uppercase; }

.bc-niveau-box { position:absolute; top: 68%; left: 50%; transform:translateX(-50%); background: #fff; color: #1A237E; padding: 3px 20px; border-radius: 20px; font-size:12px; font-weight:900; border: 2px solid #C62828; text-transform:uppercase; }

.bc-qr-wrapper { position:absolute; top: 75%; left: 50%; transform:translateX(-50%); background: white; padding: 5px; border-radius: 8px; border: 2px solid #C62828; width: 90px; height: 90px; display: flex; justify-content: center; align-items: center; }
#qr-code-container-classique { width: 80px; height: 80px; }

.bc-id-box { position:absolute; top: 89%; left: 50%; transform:translateX(-50%); background: #fff; color: #1A237E; padding: 4px 15px; border-radius: 20px; font-size:12px; font-weight:900; font-family:monospace; border: 2px solid #C62828; }


/* =========================================
   BADGE INTELLO (Format Paysage)
   ========================================= */
#badgeIntello { 
  width: 420px; height: 300px; 
  background-image: url('fond_badge_intello.jpg');
  background-size: 100% 100%;
  border-radius:12px; position:relative; box-shadow:0 10px 30px rgba(0,0,0,0.4);
  margin:0 auto; overflow:hidden; 
}
.bi-photo-box { position:absolute; right: 8%; top: 35%; width: 100px; height: 120px; background: #eee; border-radius: 5px; overflow:hidden; border: 2px solid #fff; display:flex; justify-content:center; align-items:center; }
.bi-photo-box img { width:100%; height:100%; object-fit:cover; display:none; }
.bi-photo-fallback { width:100%; height:100%; background: url('logo.png') center/cover; display:block; }

.bi-nom { position:absolute; left: 25%; top: 64%; width: 40%; font-size: 14px; font-weight: 900; color: #1A237E; text-transform: uppercase; }
.bi-id { position:absolute; left: 25%; top: 73%; width: 40%; font-size: 14px; font-weight: 900; color: #1A237E; font-family: monospace; }
.bi-qr-box { position:absolute; left: 5%; bottom: 8%; width: 80px; height: 80px; background: white; padding: 2px; }
#qr-code-container-intello { width: 76px; height: 76px; }


@media print {
  @page { size: A7 portrait; margin: 0; }
  body * { visibility: hidden; }
  #badgeClassique, #badgeClassique *, #badgeIntello, #badgeIntello * { visibility: visible; }
  #badgeClassique, #badgeIntello { position: fixed; left: 0; top: 0; box-shadow: none; border-radius: 0; border: none; }
}
.hidden { display:none !important; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🎫 Générateur de Badge UTP</h1>
  </div>

  <div class="form-group" style="background:#F1F8E9; padding:15px; border-radius:10px; border:1px solid #C8E6C9; margin-bottom:20px;">
    <label style="color:#2E7D32;">🔍 Rechercher un élève (ID ou Nom)</label>
    <div style="display:flex; gap:10px;">
      <input type="text" id="searchEleve" placeholder="Tapez l'ID (ex: UTP-3000)..." style="flex:1;">
      <button class="btn btn-primary" style="width:auto; margin-top:0; padding:12px 20px;" onclick="chercherEleve()">Vérifier</button>
    </div>
    <div id="searchStatus" style="font-size:11px; color:#666; margin-top:5px;"></div>
  </div>

  <div id="statutPaiement" class="alerte" style="display:none;"></div>

  <div class="form-row">
    <div class="form-group">
      <label>Nom de famille</label>
      <input type="text" id="nomBadge" readonly>
    </div>
    <div class="form-group">
      <label>Prénom(s)</label>
      <input type="text" id="prenomBadge" readonly>
    </div>
  </div>
  
  <div class="form-row">
    <div class="form-group">
      <label>Centre</label>
      <input type="text" id="centreBadge" readonly>
    </div>
    <div class="form-group">
      <label>Niveau</label>
      <input type="text" id="niveauBadge" readonly>
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>ID Badge</label>
      <input type="text" id="idBadge" readonly>
    </div>
    <div class="form-group">
      <label>Date d'expiration (Auto)</label>
      <input type="text" id="dateExpiration" readonly>
    </div>
  </div>

  <h3 style="font-size:14px; color:#1A237E; margin-bottom:10px; margin-top:20px; border-bottom:1px solid #eee; padding-bottom:5px;">📸 Photo de l'élève (Optionnel)</h3>
  
  <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none;" onchange="handleFileUpload(event)">
  
  <button class="btn-camera" onclick="document.getElementById('fileInput').click()">📸 Prendre une photo avec l'appareil</button>
  <button class="btn-photo" onclick="document.getElementById('fileInput').click()">📁 Choisir une image</button>

  <button class="btn btn-primary" id="btnGenerer" onclick="genererBadge()" disabled>🎫 Générer le Badge</button>
  <button class="btn btn-secondary" onclick="window.location.href='/'">⬅️ Retour</button>

  <div id="previewContainer" class="preview-container">
    <h3 style="color:#1A237E; margin-bottom:15px;">Aperçu du Badge</h3>
    
    <!-- BADGE CLASSIQUE -->
    <div id="badgeClassique" class="hidden">
      <div class="bc-centre-name" id="previewCentreC">CENTRE UTP</div>
      
      <div class="bc-photo-box">
        <img id="previewPhotoC" src="">
        <div class="bc-photo-fallback" id="fallbackPhotoC"></div>
      </div>

      <div class="bc-nom-box"><div class="text" id="previewNomC">NOM</div></div>
      <div class="bc-prenom-box"><div class="text" id="previewPrenomC">PRENOM</div></div>
      
      <div class="bc-niveau-box" id="previewNiveauC">NIVEAU</div>
      
      <div class="bc-qr-wrapper"><div id="qr-code-container-classique"></div></div>
      <div class="bc-id-box">ID <span id="previewIdC">—</span></div>
    </div>

    <!-- BADGE INTELLO -->
    <div id="badgeIntello" class="hidden">
      <div class="bi-photo-box">
        <img id="previewPhotoI" src="">
        <div class="bi-photo-fallback" id="fallbackPhotoI"></div>
      </div>
      <div class="bi-nom" id="previewNomI">—</div>
      <div class="bi-id" id="previewIdI">—</div>
      <div class="bi-qr-box"><div id="qr-code-container-intello"></div></div>
    </div>
    
    <button class="btn btn-primary" style="margin-top:20px; background:#2E7D32;" onclick="imprimerBadge()">🖨️ Imprimer / Télécharger</button>
  </div>
</div>

<script>
var eleveActuel = null;
var qrCodeInstanceC = null;
var qrCodeInstanceI = null;
var badgeType = null;

// Configuration du montant total (pour le calcul du reste à payer)
const MONTANT_TOTAL = 50000; // À ajuster selon votre tarif

const API_BASE = '';
function apiHeaders() {
  const code = sessionStorage.getItem('utp_code') || prompt('Code d\'accès :');
  if (code) sessionStorage.setItem('utp_code', code);
  return { 'Content-Type': 'application/json', 'x-code-acces': code || '' };
}

async function apiFetch(path) {
  const r = await fetch(API_BASE + path, { headers: apiHeaders() });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Erreur API');
  return r.json();
}

// Calcul de la date d'expiration (Date d'examen + 15 jours)
function calculerDateExpiration(dateEntree, matiere) {
  const d = new Date(dateEntree);
  if (matiere === 'Anglais' || matiere === 'Français') {
    d.setMonth(d.getMonth() + 2);
  } else {
    d.setMonth(d.getMonth() + 3);
  }
  d.setDate(d.getDate() + 15); // Ajoute 15 jours de marge après l'examen
  return d.toLocaleDateString('fr-FR');
}

async function chercherEleve() {
  var query = document.getElementById('searchEleve').value.trim();
  var status = document.getElementById('searchStatus');
  var statutPaiement = document.getElementById('statutPaiement');
  
  if (!query) return;
  status.textContent = "⏳ Recherche...";
  
  try {
    const eleves = await apiFetch('/api/etudiants');
    const q = query.toLowerCase();
    const found = eleves.find(e => e.utp_id.toLowerCase() === q || (e.nom + ' ' + e.prenom).toLowerCase().includes(q));

    if (!found) {
      status.textContent = "❌ Aucun élève trouvé.";
      status.style.color = "#C62828";
      return;
    }

    eleveActuel = found;

    document.getElementById('nomBadge').value = found.nom;
    document.getElementById('prenomBadge').value = found.prenom || '';
    document.getElementById('centreBadge').value = found.centre_nom;
    document.getElementById('niveauBadge').value = found.niveau;
    document.getElementById('idBadge').value = found.utp_id;
    
    // Calcul de la date d'expiration
    document.getElementById('dateExpiration').value = calculerDateExpiration(found.date_entree, found.matiere);

    status.textContent = "✅ Élève trouvé : " + found.nom;
    status.style.color = "#2E7D32";

    const btnGenerer = document.getElementById('btnGenerer');
    if (found.montant_paye >= 20000) {
      statutPaiement.className = 'alerte alerte-ok';
      statutPaiement.textContent = `💰 Paiement validé. Badge autorisé.`;
      statutPaiement.style.display = 'block';
      btnGenerer.disabled = false;
    } else {
      statutPaiement.className = 'alerte alerte-ko';
      statutPaiement.textContent = `⛔ Paiement insuffisant (${found.montant_paye} Ar). 20 000 Ar requis.`;
      statutPaiement.style.display = 'block';
      btnGenerer.disabled = true;
    }

    const centreLower = (found.centre_nom || '').toLowerCase();
    badgeType = centreLower.indexOf('intello') !== -1 ? 'intello' : 'classique';

    updatePreview();
  } catch (err) {
    status.textContent = "❌ Erreur : " + err.message;
  }
}

function handleFileUpload(event) {
  var file = event.target.files[0];
  if (file) {
    var reader = new FileReader();
    reader.onload = function(e) {
      document.getElementById('previewPhotoC').src = e.target.result;
      document.getElementById('previewPhotoC').style.display = 'block';
      document.getElementById('fallbackPhotoC').style.display = 'none';
      
      document.getElementById('previewPhotoI').src = e.target.result;
      document.getElementById('previewPhotoI').style.display = 'block';
      document.getElementById('fallbackPhotoI').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }
}

function updatePreview() {
  var nom = document.getElementById('nomBadge').value.trim() || '—';
  var prenom = document.getElementById('prenomBadge').value.trim() || '—';
  var centre = document.getElementById('centreBadge').value.trim() || 'CENTRE UTP';
  var id = document.getElementById('idBadge').value.trim() || 'UTP-XXXX';
  var niveau = document.getElementById('niveauBadge').value.trim() || '—';

  document.getElementById('previewCentreC').textContent = centre;
  document.getElementById('previewNomC').textContent = nom.toUpperCase();
  document.getElementById('previewPrenomC').textContent = prenom.toUpperCase();
  document.getElementById('previewNiveauC').textContent = niveau;
  document.getElementById('previewIdC').textContent = id;

  document.getElementById('previewNomI').textContent = nom.toUpperCase() + ' ' + prenom.toUpperCase();
  document.getElementById('previewIdI').textContent = id;
}

function genererBadge() {
  if (!eleveActuel || !badgeType) return;
  updatePreview();

  var nom = document.getElementById('nomBadge').value.trim();
  var prenom = document.getElementById('prenomBadge').value.trim();
  var id = document.getElementById('idBadge').value.trim();
  var centre = document.getElementById('centreBadge').value.trim();
  var dateExp = document.getElementById('dateExpiration').value;

  // Calcul du reste à payer
  var resteAPayer = MONTANT_TOTAL - eleveActuel.montant_paye;
  var statutPaiement = resteAPayer > 0 ? `Reste à payer : ${resteAPayer} Ar` : "Soldé";

  // Contenu du QR Code (vCard standard avec les infos demandées)
  var qrData = `BEGIN:VCARD
VERSION:3.0
N:${nom};${prenom};;;
FN:${nom} ${prenom}
ORG:UTP Madagascar - ${centre}
TITLE:${id}
NOTE:Statut paiement: ${statutPaiement}\nExpire le: ${dateExp}
END:VCARD`;

  // Nettoyage
  if (qrCodeInstanceC) { qrCodeInstanceC = null; document.getElementById('qr-code-container-classique').innerHTML = ''; }
  if (qrCodeInstanceI) { qrCodeInstanceI = null; document.getElementById('qr-code-container-intello').innerHTML = ''; }

  // QR Classique
  qrCodeInstanceC = new QRCodeStyling({
    width: 200, height: 200, data: qrData,
    image: "logo.png",
    dotsOptions: { color: "#0D47A1", type: "rounded" },
    backgroundOptions: { color: "#ffffff" }
  });
  qrCodeInstanceC.append(document.getElementById('qr-code-container-classique'));

  // QR Intello
  qrCodeInstanceI = new QRCodeStyling({
    width: 200, height: 200, data: qrData,
    dotsOptions: { color: "#1A237E", type: "square" },
    backgroundOptions: { color: "#ffffff" }
  });
  qrCodeInstanceI.append(document.getElementById('qr-code-container-intello'));

  if (badgeType === 'intello') {
    document.getElementById('badgeClassique').classList.add('hidden');
    document.getElementById('badgeIntello').classList.remove('hidden');
  } else {
    document.getElementById('badgeIntello').classList.add('hidden');
    document.getElementById('badgeClassique').classList.remove('hidden');
  }

  document.getElementById('previewContainer').style.display = 'block';
  document.getElementById('previewContainer').scrollIntoView({ behavior: 'smooth' });
}

function imprimerBadge() {
  var isIntello = !document.getElementById('badgeIntello').classList.contains('hidden');
  var element = isIntello ? document.getElementById('badgeIntello') : document.getElementById('badgeClassique');

  setTimeout(function() {
    html2canvas(element, { useCORS: true, scale: 4, backgroundColor: null }).then(function(canvas) {
      var dataUrl = canvas.toDataURL('image/png');
      var win = window.open('', '_blank');
      win.document.write(`
        <html><head><title>Badge UTP</title>
        <style>@page { size: A7; margin: 0; } body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; } img { max-width: 100%; max-height: 100%; } @media print { body { background: white; } img { width: 100%; } }</style></head>
        <body><img src="${dateUrl}" onload="window.print();"></body></html>
      `);
      win.document.close();
    });
  }, 500);
}
</script>
</body>
</html>
